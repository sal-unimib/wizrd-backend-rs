[package]
name = "wizrd-backend"
version = "0.1.0"
edition = "2021"
description = "WizRD Backend - Rust implementation"

[dependencies]
rocket = { version = "0.5", features = ["json", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
wkt = { version = "0.14.0" }
geojson = "0.24.2"
geo-traits = "0.3.0"
geo-types = "0.7.17"
rocket_cors = "0.6.0"

[dependencies.rocket_db_pools]
version = "0.2.0"
features = ["sqlx_postgres", "sqlx_macros"]

[dependencies.sqlx]
version = "0.7"
default-features = false
features = ["macros", "migrate", "postgres"]
