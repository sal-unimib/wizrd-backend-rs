#      - "7000:7000"
#    depends_on:
#      - wizrd-db
#      - wizrd-pgadmin
#    networks:
#      - wizrd-net

networks:
  wizrd-net:
    driver: bridge
    external: true

volumes:
  wizrd-vol:
